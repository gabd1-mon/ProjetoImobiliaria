spring.application.name=imobiliaria
spring.datasource.url=jdbc:mysql://localhost:3306/imobiliaria
spring.datasource.username=root
spring.datasource.password=root123

# Dizemos ao Hibernate para não criar as tabelas sozinho, pois essa será a função do Flyway
spring.jpa.hibernate.ddl-auto=validate

# Exibir os comandos SQL formatados no console (útil para entender o que o Spring Data JPA está executando)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
